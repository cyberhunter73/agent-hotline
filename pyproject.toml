[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hotline"
version = "0.1.0"
description = "A phone line for a local Claude agent: inbound calls with a caller allowlist and spoken permission gate, plus rate-limited outbound notifications."
license = { text = "MIT" }
authors = [{ name = "Joseph Rubin" }]
requires-python = ">=3.11"
# Pinned reference stack. Each non-LiveKit piece sits behind a swappable interface.
dependencies = [
    "livekit-agents~=1.8.10",
    "claude-agent-sdk~=0.2.178",
    "faster-whisper~=1.2.1",
    # Kokoro TTS. The PyPI distribution name is "kokoro"; no code in task 1 imports it.
    "kokoro~=0.7.16",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
]

[tool.setuptools.packages.find]
include = ["agent_hotline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
